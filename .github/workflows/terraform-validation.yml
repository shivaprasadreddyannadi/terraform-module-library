name: Terraform Module Validation

on:
  push:
    branches:
      - main
      - master
    paths:
      - "modules/**"
      - "examples/**"
      - ".github/workflows/terraform-validation.yml"

  pull_request:
    paths:
      - "modules/**"
      - "examples/**"
      - ".github/workflows/terraform-validation.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format and Validate Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize resource-group example
        working-directory: examples/resource-group
        run: terraform init -backend=false

      - name: Validate resource-group example
        working-directory: examples/resource-group
        run: terraform validate
        
      - name: Initialize virtual-network example
        working-directory: examples/virtual-network
        run: terraform init -backend=false

      - name: Validate virtual-network example
        working-directory: examples/virtual-network
        run: terraform validate

      - name: Initialize storage-account example
        working-directory: examples/storage-account
        run: terraform init -backend=false

      - name: Validate storage-account example
        working-directory: examples/storage-account
        run: terraform validate

      - name: Initialize key-vault example
        working-directory: examples/key-vault
        run: terraform init -backend=false

      - name: Validate key-vault example
        working-directory: examples/key-vault
        run: terraform validate